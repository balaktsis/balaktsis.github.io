name: Update Publications

on:
  schedule:
    # Run weekly on Monday at midnight
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly requests
          
      - name: Fetch publications from Google Scholar
        run: python .github/scripts/fetch_publications.py
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add publications.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update publications from Google Scholar"
          git push